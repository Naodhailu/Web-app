<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachemo SE Section A - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="form-container" id="form-container">

            <form class="form login-form" id="login-form">
                <div class="header">
                    <h1>Wachemo SE Section A</h1>
                    <p>Welcome back! Please login.</p>
                </div>

                <div id="login-alert" class="alert" style="display: none;"></div>

                <div class="input-group">
                    <input type="text" id="login-username" required autocomplete="username">
                    <label for="login-username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" required autocomplete="current-password">
                    <label for="login-password">Password</label>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="toggle-text">
                    Don't have an account? <span id="to-signup">Sign up</span>
                </div>
            </form>

            <form class="form signup-form" id="signup-form">
                <div class="header">
                    <h1>Create Account</h1>
                    <p>Join Wachemo SE Section A portal.</p>
                </div>

                <div id="signup-alert" class="alert" style="display: none;"></div>

                <div class="input-group">
                    <input type="text" id="signup-username" required autocomplete="username">
                    <label for="signup-username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-password" required autocomplete="new-password">
                    <label for="signup-password">Password</label>
                </div>
                <button type="submit" class="btn">Sign Up</button>
                <div class="toggle-text">
                    Already have an account? <span id="to-login">Login</span>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
